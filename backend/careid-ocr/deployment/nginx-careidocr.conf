# CareID Standalone OCR Microservice — Nginx Reverse Proxy Configuration
# Domain: careidocr.dokaan.in
# Upstream: 127.0.0.1:5050 (Uvicorn FastAPI Daemon)

# Rate limiting zone for OCR processing (burst protection)
limit_req_zone $binary_remote_addr zone=careid_ocr_limit:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name careidocr.dokaan.in;

    # Force HTTPS redirect
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name careidocr.dokaan.in;

    # SSL Certificate Configuration (Let's Encrypt / aaPanel Standard Paths)
    ssl_certificate /etc/letsencrypt/live/careidocr.dokaan.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/careidocr.dokaan.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1440m;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Maximum upload size for multi-page medical PDFs
    client_max_body_size 60M;
    client_body_buffer_size 10M;

    # Timeouts for high-density OCR workloads
    proxy_connect_timeout 60s;
    proxy_send_timeout 240s;
    proxy_read_timeout 240s;
    send_timeout 240s;

    # Public Health Endpoint
    location /health {
        proxy_pass http://127.0.0.1:5050/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public Readiness Probe
    location /ready {
        proxy_pass http://127.0.0.1:5050/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Internal Protected OCR Routes (Requires X-CareID-Internal-Secret)
    location /internal/ {
        limit_req zone=careid_ocr_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:5050/internal/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering to stream multi-megabyte multipart uploads directly
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Block all other paths
    location / {
        return 404 '{"success": false, "error": "NotFound", "message": "CareID OCR Service"}';
        default_type application/json;
    }
}

