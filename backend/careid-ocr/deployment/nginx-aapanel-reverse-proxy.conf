# ==============================================================================
# CareID Standalone OCR — aaPanel Managed Reverse Proxy Configuration
# Target Domain: careidocr.dokaan.in
# Upstream Daemon: 127.0.0.1:5050 (FastAPI Uvicorn)
#
# INSTRUCTIONS FOR AAPANEL USERS:
# 1. In aaPanel, create website: careidocr.dokaan.in (Pure HTML / Static).
# 2. Go to Website Settings -> SSL -> Apply for Let's Encrypt SSL.
# 3. Go to Website Settings -> Configuration (or Reverse Proxy).
# 4. Insert the directives below inside the server { ... } block.
# DO NOT OVERWRITE the entire server block to preserve aaPanel SSL & logs!
# ==============================================================================

# 1. Increase upload size for large multi-page medical PDFs
client_max_body_size 60M;
client_body_buffer_size 10M;

# 2. Configure proxy timeouts for high-density document OCR processing
proxy_connect_timeout 60s;
proxy_send_timeout 240s;
proxy_read_timeout 240s;
send_timeout 240s;

# 3. Public Health & Readiness Probes
location /health {
    proxy_pass http://127.0.0.1:5050/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /ready {
    proxy_pass http://127.0.0.1:5050/ready;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 4. Internal Protected OCR Routes (Authenticated via X-CareID-Internal-Secret)
location /internal/ {
    proxy_pass http://127.0.0.1:5050/internal/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Stream multi-megabyte multipart uploads directly without disk buffering
    proxy_buffering off;
    proxy_request_buffering off;
}

